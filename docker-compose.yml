version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: swagath-tech-website:latest
    container_name: swagath_tech_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3