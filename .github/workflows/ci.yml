name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    name: Code & Security Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Automated Architecture & Security Tests
        run: node --test tests/app.test.js

  container-security-build:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: swagath-tech-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'swagath-tech-website:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
